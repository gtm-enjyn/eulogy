name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Bruin v0.11.832
        run: |
          base=https://github.com/bruin-data/bruin/releases/download/v0.11.832
          curl -fsSLO "$base/bruin_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/bruin_0.11.832_checksums.txt"
          grep ' bruin_Linux_x86_64.tar.gz$' bruin_0.11.832_checksums.txt | sha256sum -c -
          tar -xzf bruin_Linux_x86_64.tar.gz bruin
          sudo install bruin /usr/local/bin/bruin
        working-directory: /tmp
      - run: bruin validate bruin/eulogy
      - run: bruin run bruin/eulogy
      - run: bash bruin/export.sh && git diff --exit-code -- apps/web/public/data/marts.json
